name: Deploy VPS

# Builds the image in GitHub Actions (the VPS has no spare RAM for vite build)
# and SSHes only this compose project.
#
# Production: after CI succeeds on a push to main, or a manual workflow_dispatch
# once this file is on the default branch.
# Staging: a push to staging/** or cursor/hostinger-vps-self-host-4d20 runs
# this file from that branch (workflow_dispatch cannot, until it is on main).
# A non-main push tags the image staging + SHA and deploys the staging
# service only. It never tags or starts production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Which host to deploy
        type: choice
        options:
          - production
          - staging
        default: production
      git_sha:
        description: Commit SHA to build and deploy. Empty uses the current ref.
        required: false
        type: string
  push:
    branches:
      - 'staging/**'
      - cursor/hostinger-vps-self-host-4d20

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve commit
        id: meta
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHA="${{ github.event.inputs.git_sha }}"
            if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
            TARGET="${{ github.event.inputs.target }}"
            BRANCH_PUSH=0
          elif [ "$EVENT" = "push" ]; then
            SHA="${{ github.sha }}"
            TARGET="staging"
            BRANCH_PUSH=1
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            TARGET="production"
            BRANCH_PUSH=0
          fi
          if [ "$EVENT" = "push" ] && [ "$TARGET" != "staging" ]; then
            echo "A branch push deploys staging only." >&2
            exit 1
          fi
          if [ "$TARGET" = "staging" ]; then
            MOVING="staging"
          elif [ "$TARGET" = "production" ]; then
            MOVING="prod"
          else
            echo "Unknown target $TARGET" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "moving_tag=$MOVING" >> "$GITHUB_OUTPUT"
          echo "branch_push=$BRANCH_PUSH" >> "$GITHUB_OUTPUT"
          echo "Deploying $TARGET at $SHA (image tag $MOVING)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ascendmaui/clemson-airport-rides:${{ steps.meta.outputs.sha }}
            ghcr.io/ascendmaui/clemson-airport-rides:${{ steps.meta.outputs.moving_tag }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prefer a public GHCR package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The image has no server secrets. Public VITE_* values are already
          # in the browser bundle. A public package lets the VPS pull without
          # a token. Do not print the API body.
          for url in \
            "https://api.github.com/orgs/ascendmaui/packages/container/clemson-airport-rides" \
            "https://api.github.com/user/packages/container/clemson-airport-rides"
          do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$url" \
              -d '{"visibility":"public"}')"
            echo "visibility status $code"
            if [ "$code" = "200" ]; then
              break
            fi
          done

      - name: Check SSH deploy key
        id: ssh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SSH deploy skipped::VPS_SSH_KEY is not set. The image was pushed to GHCR. Add VPS_SSH_KEY, VPS_HOST, VPS_USER, and VPS_KNOWN_HOSTS to deploy the container."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.ssh.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SHA: ${{ steps.meta.outputs.sha }}
          TARGET: ${{ steps.meta.outputs.target }}
          BRANCH_PUSH: ${{ steps.meta.outputs.branch_push }}
        run: |
          set -euo pipefail
          set +x
          bash deploy/prepare-ssh.sh
          host="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          user="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          ssh_opts=(
            -i "$HOME/.ssh/deploy_key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o PreferredAuthentications=publickey
            -o ConnectTimeout=20
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o StrictHostKeyChecking=yes
          )
          dest="$user@$host"
          ssh "${ssh_opts[@]}" "$dest" "mkdir -p /opt/clemson-rides/src/deploy"
          scp "${ssh_opts[@]}" deploy/docker-compose.yml "$dest:/opt/clemson-rides/src/deploy/docker-compose.yml"
          ssh "${ssh_opts[@]}" "$dest" \
            "IMAGE_TAG=$(printf '%q' "$SHA") TARGET=$(printf '%q' "$TARGET") BRANCH_PUSH=$(printf '%q' "$BRANCH_PUSH") GHCR_USER=$(printf '%q' "$GHCR_USER") GHCR_TOKEN=$(printf '%q' "$GHCR_TOKEN") bash -s" \
            < deploy/remote-up.sh
