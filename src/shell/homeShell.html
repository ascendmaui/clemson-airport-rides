<!--

hot mkt-hero-shot--backseat"><picture class="mkt-photo"><source type="image/webp" srcset="/images/lifestyle/airport-on-time-480.webp 480w, /images/lifestyle/airport-on-time-768.webp 768w, /images/lifestyle/airport-on-time-1280.webp 1280w" sizes="(min-width: 960px) 340px, 62vw"><img src="/images/lifestyle/airport-on-time.jpg" alt="Two Clemson students with suitcases at the airport departures curb beside their ride" width="1280" height="720" loading="lazy" decoding="async" fetchpriority="auto"></picture></figure></div></div></section></main></div></div></div></div>
<script>
(function () {
  var frame = document.querySelector('[data-home-shell]');
  if (!frame) return;
  if (document.documentElement.getAttribute('data-home-shell') !== '1') { frame.remove(); return; }
  var root = frame.querySelector('.mkt-home');
  var hero = frame.querySelector('.mkt-stage');
  if (root && hero) root.style.setProperty('--mkt-hero-h', Math.ceil(hero.getBoundingClientRect().bottom - root.getBoundingClientRect().top) + 'px');
})();
</script>
