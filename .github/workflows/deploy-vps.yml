name: Deploy VPS

# Builds the image in GitHub Actions (the VPS has no spare RAM for vite build)
# and SSHes only this compose project. Runs after CI succeeds on main, or
# when someone starts it by hand for production or staging.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Which host to deploy
        type: choice
        options:
          - production
          - staging
        default: production
      git_sha:
        description: Commit SHA to build and deploy. Empty uses the current ref.
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve commit
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.event.inputs.git_sha }}"
            if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
            TARGET="${{ github.event.inputs.target }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            TARGET="production"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Deploying $TARGET at $SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ascendmaui/clemson-airport-rides:${{ steps.meta.outputs.sha }}
            ghcr.io/ascendmaui/clemson-airport-rides:${{ steps.meta.outputs.target == 'staging' && 'staging' || 'prod' }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prefer a public GHCR package
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The image has no server secrets. Public VITE_* values are already
          # in the browser bundle. A public package lets the VPS pull without
          # a token. Do not print the API body.
          for url in \
            "https://api.github.com/orgs/ascendmaui/packages/container/clemson-airport-rides" \
            "https://api.github.com/user/packages/container/clemson-airport-rides"
          do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$url" \
              -d '{"visibility":"public"}')"
            echo "visibility status $code"
            if [ "$code" = "200" ]; then
              break
            fi
          done

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SHA: ${{ steps.meta.outputs.sha }}
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "IMAGE_TAG=$(printf '%q' "$SHA") TARGET=$(printf '%q' "$TARGET") bash -s" \
            < deploy/remote-up.sh
